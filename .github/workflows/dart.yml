name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r kafe-stogu.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafe-stogu-ipa
          path: build/ios/iphoneos/kafe-stogu.ipa

      - name: Upload IPA to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/kafe-stogu.ipa
          asset_name: kafe-stogu.ipa
          tag: v1.0
          overwrite: true
          body: "Kafe Stogu iOS IPA build"
